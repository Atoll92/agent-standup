# Publishes a release everywhere it can: VS Code Marketplace, Open VSX (Cursor, Windsurf, VSCodium…) and npm (the `agent-standup` command).
# The Marketplace and npm are skipped when their secret is not set. Secrets to add in the repository settings:
#   VSCE_PAT  (Azure DevOps token, scope Marketplace > Manage)   NPM_TOKEN  (npm automation token)
# Open VSX needs no secret: this file (publish.yml) is registered there as the trusted publisher of the extension. Renaming the file breaks that link.
name: Publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  test:   # nothing is published from a commit whose tests fail
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false   # no cache in the workflow that publishes: what it ships is built from the commit alone
      - run: npm ci
      - run: npm test
      - run: npm run i18n
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Open VSX trusted publishing: the registry gives this workflow a short-lived token in exchange for its identity, so there is no Open VSX secret to keep
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false   # no cache in the workflow that publishes: what it ships is built from the commit alone
          registry-url: https://registry.npmjs.org
      - name: Which targets have a token   # each token is only given to the step that publishes with it, not to the tools the other steps download
        id: has
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}   # not called NODE_AUTH_TOKEN on purpose: setup-node fills that one with a placeholder when it is unset, which would make the check always true
        run: |
          echo "vsce=${VSCE_PAT:+yes}" >> "$GITHUB_OUTPUT"
          echo "npm=${NPM_TOKEN:+yes}" >> "$GITHUB_OUTPUT"
      - name: Build the extension package
        run: npx --yes @vscode/vsce@4.0.0 package -o extension.vsix
      - name: VS Code Marketplace
        if: steps.has.outputs.vsce == 'yes'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@4.0.0 publish --packagePath extension.vsix --skip-duplicate
      - name: npm
        if: steps.has.outputs.npm == 'yes'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "npm account: $(npm whoami 2>/dev/null || echo 'unknown (token cannot read the profile, that is fine)')"
          node scripts/build-cli.js
          cd dist-cli
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then echo "already published"; else npm publish --access public; fi
      - name: Open VSX   # last, so that a refusal there does not hold back the other targets. No token: this workflow file is registered as the trusted publisher of the extension (open-vsx.org → Settings → Namespaces → Trusted publishers)
        run: npx --yes ovsx@1.2.0 publish extension.vsix --trusted-publishing --skip-duplicate
