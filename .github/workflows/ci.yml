name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read   # the checks only read the repository
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # the tests take a few minutes; a hung browser should not hold a runner for six hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check server.js
          node --check codex.js
          node --check vibe.js
          node --check kokoro.js
          node --check kokoro-worker.js
          node --check demo.js
          node --check desktop/main.js
          node --check extension.js
          node --check bin/agent-standup.js
          node -e "new Function('return async function(){' + require('fs').readFileSync('public/index.html','utf8').split('<script>')[1].split('</script>')[0] + '}')"
      - name: One version everywhere
        run: |
          v=$(node -p "require('./package.json').version")
          test "$v" = "$(node -p "require('./desktop/package.json').version")" || { echo "desktop/package.json is not at $v"; exit 1; }
          test "$v" = "$(node -p "require('./desktop/package-lock.json').version")" || { echo "desktop/package-lock.json is not at $v"; exit 1; }
          grep -q "^## $v\$" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $v"; exit 1; }
          node scripts/sync-plugin.js --check
      - name: Tests (the server, and the live call in a real browser)
        run: |
          npm ci
          npm test
      - name: Translations are complete and consistent
        run: npm run i18n
      - name: Package the command line tool and smoke-test it
        run: |
          node scripts/build-cli.js
          cd dist-cli && npm pack --silent && cd ..
          mkdir /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null && npm i --silent "$GITHUB_WORKSPACE"/dist-cli/*.tgz
          ./node_modules/.bin/agent-standup --version
          ./node_modules/.bin/agent-standup status
          (./node_modules/.bin/agent-standup --port 4791 &) ; sleep 2
          curl -fsS localhost:4791/api/health
          curl -fsS -o /dev/null localhost:4791/
          curl -fsS -o /dev/null localhost:4791/locales/ja.json
